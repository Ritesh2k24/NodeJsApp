name: Build and Push Docker Image

on:
  push:
    branches: [ Develope ]

env:
  # we'll set them dynamically
  # DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/nodejsapp
  # DOCKER_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set lowercase username
        run: |
          # Convert username to lowercase
          LOWERCASE_USERNAME=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          echo "DOCKER_USERNAME_LOWER=$LOWERCASE_USERNAME" >> $GITHUB_ENV
          echo "Using lowercase username: $LOWERCASE_USERNAME"

      - name: Build Docker image
        run: |
          # Use the lowercase username for the image name
          IMAGE_NAME="${{ env.DOCKER_USERNAME_LOWER }}/nodejsapp"
          echo "Building image: $IMAGE_NAME:latest"

          # Build with latest tag
          docker build -t $IMAGE_NAME:latest .
          # Tag with commit SHA
          docker tag $IMAGE_NAME:latest $IMAGE_NAME:${{ github.sha }}

          # Save the image name for later steps
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Push Docker image to DockerHub
        run: |
          echo "Pushing images for: ${{ env.IMAGE_NAME }}"
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify Docker images
        run: |
          echo "Successfully built and pushed images:"
          docker images | grep "${{ env.DOCKER_USERNAME_LOWER }}/nodejsapp"
